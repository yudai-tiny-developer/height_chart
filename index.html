<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height Chart Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <h1>Height Chart</h1>
          <p>Generator</p>
        </div>
        <div class="lang-switch">
          <button id="lang-en" class="active" onclick="setLanguage('en')">EN</button>
          <button id="lang-ja" onclick="setLanguage('ja')">JA</button>
        </div>
      </div>
      <div class="actions">
        <button id="btn-use-sample" class="btn btn-secondary" data-i18n="btn-use-sample">Use Sample Data</button>
      </div>
      <div class="control-group">
        <label data-i18n="images-label">Images</label>
        <div class="drop-zone image-drop-zone" id="image-drop-zone">
          <p data-i18n="images-drop" style="margin-bottom: 8px;">Drag & Drop PNG images here</p>
          <ul id="loaded-images-list"></ul>
        </div>
      </div>
      <div class="control-group">
        <label for="csv-input" data-i18n="csv-label">CSV Data</label>
        <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; line-height: 1.4;">
          <code style="color: var(--accent-color);">Filename, Height, TopY, BottomY, LeftX, RightX</code>
        </div>
        <div class="drop-zone" id="csv-drop-zone">
          <textarea id="csv-input" data-i18n="csv-placeholder"
                    placeholder="Paste CSV data here or drag & drop a .csv file..."></textarea>
          <div class="drop-overlay" data-i18n="csv-drop">Drop CSV Here</div>
        </div>
      </div>
      <div class="settings-panel">
        <h3 data-i18n="settings-title">Settings</h3>
        <div class="setting-row">
          <label for="setting-margin-x" data-i18n="margin-x">Character Spacing (px)</label>
          <input type="number" id="setting-margin-x" value="20">
        </div>
        <div class="setting-row">
          <label for="setting-margin-top" data-i18n="margin-top">Top Margin (px)</label>
          <input type="number" id="setting-margin-top" value="10">
        </div>
        <div class="setting-row">
          <label for="setting-margin-bottom" data-i18n="margin-bottom">Bottom Margin (px)</label>
          <input type="number" id="setting-margin-bottom" value="100">
        </div>
        <div class="setting-row">
          <label for="setting-unit" data-i18n="unit-label">Display Unit</label>
          <select id="setting-unit" class="setting-select">
            <option value="cm">cm</option>
            <option value="ftin">ft / in</option>
          </select>
        </div>
        <div class="setting-toggle">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-draw-bg" checked>
            <span class="slider"></span>
          </label>
          <span class="toggle-label" data-i18n="draw-bg">Draw Background Grid</span>
        </div>
        <div class="setting-toggle">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-draw-height" checked>
            <span class="slider"></span>
          </label>
          <span class="toggle-label" data-i18n="draw-height">Draw Height Values</span>
        </div>
      </div>
      <div class="actions">
        <button id="btn-generate" class="btn btn-primary" data-i18n="btn-generate">Generate Chart</button>
        <button id="btn-download" class="btn btn-secondary" disabled data-i18n="btn-download">Download PNG</button>
      </div>
    </aside>
    <main class="canvas-container">
      <div class="canvas-wrapper">
        <canvas id="result-canvas"></canvas>
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
          <p data-i18n="loading-overlay">Loading Images & Generating...</p>
        </div>
      </div>
    </main>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="script.js"></script>
</body>

</html>
